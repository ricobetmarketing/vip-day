<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>DIA VIP - Gire e Ganhe</title>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
:root{
  --pink:#ff75e2;
  --bg:#121125;
  --stroke: rgba(255,255,255,.12);
  --text:#f5f7ff;
  --red:#ff4d4d;
  --shadow: 0 22px 60px rgba(0,0,0,.55);

  --card: clamp(96px, 24vw, 150px);
  --card-gap: clamp(8px, 2.8vw, 12px);
  --carousel-h: clamp(130px, 28vw, 180px);
}

*{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
html,body{ height:100%; margin:0; }

body{
  background:
    radial-gradient(900px 520px at 50% -10%, rgba(255,117,226,.18), transparent 60%),
    var(--bg);
  display:flex;
  align-items:center;
  justify-content:center;
  font-family: system-ui, -apple-system, sans-serif;
  color:var(--text);
}

.shell{
  width:95%;
  max-width:800px;
  border:1px solid var(--stroke);
  border-radius:32px;
  box-shadow:var(--shadow);
  overflow:hidden;
  background:rgba(255,255,255,.04);
}

.header{
  text-align:center;
  padding:24px 15px 10px;
}

.header h1{
  margin:0;
  font-size: clamp(22px, 6vw, 40px);
  background: linear-gradient(180deg, #fff, var(--pink));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.main{ padding:20px; }

.carousel-container{
  position:relative;
  height:var(--carousel-h);
  border-radius:20px;
  background:rgba(0,0,0,.35);
  overflow:hidden;
}

.pointer{
  position:absolute;
  top:0; left:50%;
  transform:translateX(-50%);
  border-left:15px solid transparent;
  border-right:15px solid transparent;
  border-top:20px solid var(--red);
  z-index:10;
}

.prize-track{
  display:flex;
  align-items:center;
  height:100%;
  transition: transform 4s cubic-bezier(0.12,0,0.08,1);
}

.prize-card{
  min-width:var(--card);
  width:var(--card);
  height:var(--card);
  margin:0 var(--card-gap);
  border-radius:22px;
  overflow:hidden;
}

.prize-card img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.controls{
  text-align:center;
  margin-top:20px;
}

#spin-btn{
  padding:15px 50px;
  font-size:18px;
  font-weight:900;
  border:none;
  border-radius:999px;
  cursor:pointer;
  background:var(--pink);
  color:#000;
}

#spin-btn:disabled{
  opacity:.5;
  cursor:not-allowed;
}

#modal-overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  align-items:center;
  justify-content:center;
}

#modal{
  width:90%;
  max-width:350px;
  background:#fff;
  border-radius:24px;
  padding:25px;
  text-align:center;
  color:#111;
}

.promo-code{
  font-size:20px;
  font-weight:900;
  background:#f0f0f0;
  padding:15px;
  border-radius:12px;
  border:2px dashed #ccc;
  margin:15px 0;
}

.copy-btn{
  padding:12px;
  border-radius:10px;
  border:none;
  cursor:pointer;
  width:100%;
  background:var(--pink);
  color:#fff;
}
</style>
</head>

<body>

<div class="shell">
  <div class="header">
    <h1>GIRE E GANHE</h1>
  </div>

  <div class="main">
    <div class="carousel-container">
      <div class="pointer"></div>
      <div class="prize-track" id="track"></div>
    </div>

    <div class="controls">
      <button id="spin-btn" onclick="spinWheel()">GIRAR AGORA</button>
    </div>
  </div>
</div>

<div id="modal-overlay">
  <div id="modal">
    <h2>PARABÉNS!</h2>
    <div class="promo-code" id="promo-code"></div>
    <button class="copy-btn" id="copy-btn">COPIAR CÓDIGO</button>
  </div>
</div>

<script>
const FIXED_CODE="wyu4Hp";
const STORAGE_KEY="vip_spin_locked_v2";
const END_DAY_UTC3=15;

const prizes=[
{img:"https://ricomx.ft-crm.com/media-api/serve/1a457da2-bdef-4c84-8202-dc91887883d4_photo_6084903068915928886_x.jpg"},
{img:"https://ricomx.ft-crm.com/media-api/serve/c2b75030-9799-4956-958d-e22f7be3a408_photo_6084903068915928887_x.jpg"},
{img:"https://ricomx.ft-crm.com/media-api/serve/32ac2add-c52a-418f-9cf9-9fde69416566_photo_6084903068915928885_x.jpg"},
{img:"https://ricomx.ft-crm.com/media-api/serve/2f4f7c2d-2e7d-4151-b5f5-4691912d44ab_photo_6084903068915928884_x.jpg"}
];

const FORCED_INDEX=2;

const track=document.getElementById("track");
const spinBtn=document.getElementById("spin-btn");
const promoCodeEl=document.getElementById("promo-code");
const modalOverlay=document.getElementById("modal-overlay");
const copyBtn=document.getElementById("copy-btn");

let spinning=false;

function isVipDayEndedUTC3(){
const now=new Date();
const utcMs=now.getTime()+(now.getTimezoneOffset()*60000);
const utc3Ms=utcMs+(-3*60*60000);
const d=new Date(utc3Ms);
return d.getDate()>END_DAY_UTC3;
}

function getSaved(){
try{
return JSON.parse(localStorage.getItem(STORAGE_KEY));
}catch(e){return null;}
}

function saveLocked(){
localStorage.setItem(STORAGE_KEY,JSON.stringify({code:FIXED_CODE}));
}

function showModal(){
promoCodeEl.innerText=FIXED_CODE;
modalOverlay.style.display="flex";
}

function lockEndedUI(){
spinBtn.disabled=true;
spinBtn.textContent="DIA VIP ENCERRADO";
promoCodeEl.innerText="O Dia VIP terminou. Volte novamente no próximo mês.";
modalOverlay.style.display="flex";
}

function init(){

for(let i=0;i<80;i++){
const prize=prizes[i%prizes.length];
const card=document.createElement("div");
card.className="prize-card";
card.innerHTML=`<img src="${prize.img}">`;
track.appendChild(card);
}

if(isVipDayEndedUTC3()){
lockEndedUI();
return;
}

const saved=getSaved();
if(saved){
spinBtn.disabled=true;
showModal();
}
}

function spinWheel(){

if(isVipDayEndedUTC3()){
lockEndedUI();
return;
}

const saved=getSaved();
if(saved){
showModal();
return;
}

if(spinning)return;
spinning=true;

setTimeout(()=>{

confetti({particleCount:150,spread:70,origin:{y:0.6}});

saveLocked();
showModal();
spinBtn.disabled=true;

spinning=false;

},3000);
}

copyBtn.onclick=()=>{
navigator.clipboard.writeText(FIXED_CODE);
};

init();
</script>

</body>
</html>
